name: Deploy Backend to ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_IMAGE: 441940082910.dkr.ecr.us-east-1.amazonaws.com/catalog-agents-api-backend:latest
  ECS_CLUSTER: catalog-agents-prod-shopify
  ECS_SERVICE: catalog-agents-api-service2
  ECS_TASK_FAMILY: catalog-agents-api-shopify
  ECS_CONTAINER: catalog-agents-api-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441940082910:role/github-actions-shopify
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.ECR_IMAGE }} \
            backend/
          docker push ${{ env.ECR_IMAGE }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ env.ECR_IMAGE }}

      - name: Deploy new task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
